    // Вспомогательные функции
    function escapeHtml(str) { 
        return str?.replace(/[&<>]/g, function(m){
            if(m==='&') return '&amp;'; 
            if(m==='<') return '&lt;'; 
            if(m==='>') return '&gt;'; 
            return m;
        }) || ''; 
    }

    function generatePassword() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let pass = '';
        for (let i = 0; i < 5; i++) {
            pass += chars[Math.floor(Math.random() * chars.length)];
        }
        return pass;
    }

    // Сжатие изображения
    function compressImage(file, callback) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const maxSize = 800;
                let width = img.width;
                let height = img.height;
                
                if (width > height && width > maxSize) {
                    height = (height * maxSize) / width;
                    width = maxSize;
                } else if (height > maxSize) {
                    width = (width * maxSize) / height;
                    height = maxSize;
                }
                
                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', 0.6));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

async function renderMessage(msg, msgId, chatType) {
    const userDoc = await db.collection("neighbours").doc(msg.userId).get();
    const userData = userDoc.exists ? userDoc.data() : { name: "Неизвестный" };
    const isSelf = msg.userId === currentUserId;
    
    const messageDiv = document.createElement('div');
    messageDiv.id = `msg-${msgId}`;
    messageDiv.className = `message ${isSelf ? 'message-self' : 'message-other'}`;
    
    const collectionName = chatType === 'general' ? 'chatcontent' : `privateMessages/${chatState.chatId}/messages`;
    
    let content = '';
    if (msg.type === 'image') {
        content = `<img src="${msg.text}" class="chat-image" onclick="openImageModal('${msg.text}')" style="max-width:350px;border-radius:12px;cursor:pointer;">`;
    } else {
        const escapedText = escapeHtml(msg.text || '');
        if (isSelf) {
            content = `<div class="bubble" onclick="openEditPanel('${msgId}', '${escapedText.replace(/'/g, "\\'")}')" style="cursor:pointer;">${escapedText}</div>`;
        } else {
            content = `<div class="bubble">${escapedText}</div>`;
        }
    }
    
    const avatarHtml = userData.avatar 
        ? `<img src="${userData.avatar}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">`
        : `<div style="width:36px;height:36px;border-radius:50%;background:#075e54;color:white;display:flex;align-items:center;justify-content:center;">${userData.name.charAt(0)}</div>`;
    
    const reactions = msg.reactions || {};
    const userReactions = msg.userReactions || {};
    const reactionEmojis = ['👍', '❤️', '😊', '😂', '😮', '😢'];
    
    let reactionsHtml = '<div class="reactions-container" style="display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap;">';
    reactionEmojis.forEach(emoji => {
        const count = reactions[emoji] || 0;
        const isActive = userReactions[currentUserId] === emoji;
        reactionsHtml += `<button class="react-btn ${isActive ? 'active' : ''}" onclick="window.addReaction('${msgId}', '${emoji}', '${collectionName}')">${emoji} ${count || ''}</button>`;
    });
    reactionsHtml += '</div>';
    
    const editedMark = msg.edited ? ' <span style="font-size: 10px; color: #667781;">(ред.)</span>' : '';
    
    messageDiv.innerHTML = `
        <div style="display:flex;align-items:flex-start;gap:8px;">
            ${avatarHtml}
            <div style="flex:1;">
                ${content}
                <div class="msg-info">
                    <span class="msg-name">${escapeHtml(userData.name)}</span>
                    <span>${msg.timestamp ? msg.timestamp.toDate().toLocaleTimeString().slice(0,5) : ''}${editedMark}</span>
                </div>
                ${reactionsHtml}
            </div>
        </div>
    `;
    
    document.getElementById('chatMessages').appendChild(messageDiv);
}

function updateMessageSeen(msgId, msg, chatType) {
    const msgDiv = document.getElementById(`msg-${msgId}`);

    const collectionName = chatType === 'general' ? 'chatcontent' : `privateMessages/${chatState.chatId}/messages`;
    const reactions = msg.reactions || {};

    const reactionEmojis = ['👍', '❤️', '😊', '😂', '😮', '😢'];
    
    let reactionsHtml = '<div class="reactions-container" style="display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap;">';

        const count = reactions[emoji] || 0;
        const isActive = userReactions[currentUserId] === emoji;
        reactionsHtml += `<button class="react-btn ${isActive ? 'active' : ''}" onclick="window.addReaction('${msgId}', '${emoji}', '${collectionName}')">${emoji} ${count || ''}</button>`;
    });
    reactionsHtml += '</div>';
    
    const oldContainer = msgDiv.querySelector('.reactions-container');
    if (oldContainer) {
        oldContainer.outerHTML = reactionsHtml;

    // Обновить (ред.) если нужно
    if (msg.edited) {

        if (msgInfo && !msgInfo.innerHTML.includes('(ред.)')) {

        }
    }

    function updateMessageSeen(msgId, msg, chatType) {
    const msgDiv = document.getElementById(`msg-${msgId}`);
    if (msgDiv) {
        const parent = msgDiv.parentNode;
        const nextSibling = msgDiv.nextSibling;
        msgDiv.remove();
        
        const tempDiv = document.createElement('div');
        renderMessage(msg, msgId, chatType).then(() => {
            const newMsg = document.getElementById(`msg-${msgId}`);
            if (newMsg && parent) {
                parent.insertBefore(newMsg, nextSibling);
            }
        });
    }
}

    // 1. В начале JS, после объявления глобальных переменных добавить:
window.addReaction = async function(msgId, emoji, collectionName) {
    if (!currentUserId) return;
    
    const msgRef = db.collection(collectionName).doc(msgId);
    
    try {
        await db.runTransaction(async (transaction) => {
            const msgDoc = await transaction.get(msgRef);
            if (!msgDoc.exists) return;
            
            const data = msgDoc.data();
            const reactions = data.reactions || {};
            const userReactions = data.userReactions || {};
            
            if (userReactions[currentUserId] === emoji) {
                reactions[emoji] = (reactions[emoji] || 1) - 1;
                if (reactions[emoji] <= 0) delete reactions[emoji];
                delete userReactions[currentUserId];
            } else {
                const oldEmoji = userReactions[currentUserId];
                if (oldEmoji) {
                    reactions[oldEmoji] = (reactions[oldEmoji] || 1) - 1;
                    if (reactions[oldEmoji] <= 0) delete reactions[oldEmoji];
                }
                reactions[emoji] = (reactions[emoji] || 0) + 1;
                userReactions[currentUserId] = emoji;
            }
            
            transaction.update(msgRef, { reactions, userReactions });
        });
    } catch (error) {
        console.error('Ошибка реакции:', error);
    }
};

// Загрузка списка контактов
    function loadContactsList() {
        if (contactsUnsubscribe) contactsUnsubscribe();
        
        contactsUnsubscribe = db.collection("neighbours").doc(currentUserId)
            .onSnapshot(async (doc) => {
                const userData = doc.data();
                const contacts = userData.contacts || [];
                
                const contactsList = document.getElementById('contactsList');
                contactsList.innerHTML = '';
                
                for (const contactId of contacts) {
                    const contactDoc = await db.collection("neighbours").doc(contactId).get();
                    if (contactDoc.exists) {
                        const contact = contactDoc.data();
                        const contactDiv = document.createElement('div');
                        contactDiv.className = 'contact-item';
                        contactDiv.innerHTML = `
                            <img class="contact-avatar" src="${contact.avatar || 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23075e54\'%3E%3Cpath d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/%3E%3C/svg%3E'}">
                            <div class="contact-info">
                                <div class="contact-name">${escapeHtml(contact.name)}</div>
                                <div class="contact-flat">${contact.flat || ''}</div>
                            </div>
                            <button class="remove-btn" onclick="removeContact('${contactId}')">✕</button>
                        `;
                        
                        contactDiv.onclick = (e) => {
                            if (e.target.tagName !== 'BUTTON') {
                                openPrivateChat(contactId, contact.name);
                            }
                        };
                        
                        contactsList.appendChild(contactDiv);
                    }
                }
            });
    }

    // Поиск людей
    document.getElementById('contactsSearch').addEventListener('input', async (e) => {
        const searchTerm = e.target.value.toLowerCase().trim();
        const searchResults = document.getElementById('searchResults');
        
        if (searchTerm.length < 2) {
            searchResults.innerHTML = '';
            return;
        }
        
        const snapshot = await db.collection("neighbours").get();
        const currentUserData = await db.collection("neighbours").doc(currentUserId).get();
        const myContacts = currentUserData.data().contacts || [];
        
        searchResults.innerHTML = '';
        
        snapshot.forEach(doc => {
            if (doc.id === currentUserId) return;
            if (myContacts.includes(doc.id)) return;
            
            const user = doc.data();
            if (user.name.toLowerCase().includes(searchTerm)) {
                const item = document.createElement('div');
                item.className = 'search-item';
                item.innerHTML = `
                    <img class="contact-avatar" src="${user.avatar || 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23075e54\'%3E%3Cpath d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/%3E%3C/svg%3E'}">
                    <div class="contact-info">
                        <div class="contact-name">${escapeHtml(user.name)}</div>
                        <div class="contact-flat">${user.flat || ''}</div>
                    </div>
                    <button class="add-btn" onclick="addContact('${doc.id}')">➕</button>

                searchResults.appendChild(item);
            }

        });
        document.getElementById('contactsSearch').value = '';
        document.getElementById('searchResults').innerHTML = '';

    // Удаление контакта
    window.removeContact = async function(contactId) {
        if (!confirm('Удалить контакт?')) return;
        
        await db.collection("neighbours").doc(currentUserId).update({
            contacts: firebase.firestore.FieldValue.arrayRemove(contactId)

    // Открытие личного чата
    function openPrivateChat(userId, userName) {
    chatState = {
        mode: 'private',
        chatWith: userId,
        chatWithName: userName,
        chatId: [currentUserId, userId].sort().join('_')
    };
    
    document.getElementById('chatTitle').innerHTML = `💬 ${userName}`;
    document.getElementById('backToGeneralBtn').classList.add('show');
    document.getElementById('contactsSidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
    
    document.getElementById('chatMessages').innerHTML = '';
    
    if (currentUnsubscribe) currentUnsubscribe();
    
    currentUnsubscribe = db.collection(`privateMessages/${chatState.chatId}/messages`)
        .orderBy("timestamp")
        .onSnapshot((snapshot) => {
            snapshot.docChanges().forEach(change => {
                if (change.type === "added") {
                    renderMessage(change.doc.data(), change.doc.id, 'private');
                    document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
                } else if (change.type === "modified") {
                    updateMessageSeen(change.doc.id, change.doc.data(), 'private');
                }
            });
        });

        document.getElementById('profileSidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('show');
    });

    document.getElementById('overlay').addEventListener('click', () => {
        document.getElementById('contactsSidebar').classList.remove('open');
        document.getElementById('profileSidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('show');
    });

        document.getElementById('imageModal').classList.remove('show');
    });

        if (e.target === document.getElementById('imageModal')) {
            document.getElementById('imageModal').classList.remove('show');
        }
    });

    // Отправка сообщений
    document.getElementById('sendMsgBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // Прикрепление изображения
    document.getElementById('attachBtn').addEventListener('click', () => {
        document.getElementById('imageInput').click();
    });

    document.getElementById('imageInput').addEventListener('change', (e) => {
        if (e.target.files[0]) {
            sendImage(e.target.files[0]);
            e.target.value = '';
        }
    });

    // Сохранение профиля
    document.getElementById('saveProfileBtn').addEventListener('click', async () => {
        const updates = {
            name: document.getElementById('editName').value,
            flat: document.getElementById('editFlat').value
        };
        
        const avatarFile = document.getElementById('avatarInput').files[0];
        if (avatarFile) {
            compressImage(avatarFile, async (base64) => {
                updates.avatar = base64;
                await db.collection("neighbours").doc(currentUserId).update(updates);
                loadUserProfile();
            });
        } else {
            await db.collection("neighbours").doc(currentUserId).update(updates);
            loadUserProfile();
        }
        
        document.getElementById('profileSidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('show');
    });

    // Выход
    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('userId');
        location.reload();
    });

    // Вкладки
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            btn.classList.add('active');
            document.getElementById(btn.dataset.tab).classList.add('active');
        });
    });

    // Запуск
    loadUserProfile();
</script>

const emojiPickerDiv = document.getElementById('emojiPicker');
const emojiToggleBtn = document.getElementById('emojiToggleBtn');
const messageInput = document.getElementById('messageInput');

emojis.forEach(e => {
    const span = document.createElement('span');
    span.className = 'emoji-item';
    span.textContent = e;
    span.onclick = () => {
        messageInput.value += e;
        emojiPickerDiv.classList.remove('show');
    };
    emojiPickerDiv.appendChild(span);
});

emojiToggleBtn.onclick = (e) => {
    e.stopPropagation();
    emojiPickerDiv.classList.toggle('show');
};

document.addEventListener('click', (e) => {
    if (!emojiPickerDiv.contains(e.target) && e.target !== emojiToggleBtn) {
        emojiPickerDiv.classList.remove('show');
    }
});
</script>
<script>
    const editPanel = document.getElementById('editPanel');
const editMessageInput = document.getElementById('editMessageInput');
const saveEditBtn = document.getElementById('saveEditBtn');
const cancelEditBtn = document.getElementById('cancelEditBtn');
const deleteMsgBtn = document.getElementById('deleteMsgBtn');

function closeEditPanel() {
    editPanel.style.display = 'none';
    editingMsgId = null;
    editingCollection = null;
    editMessageInput.value = '';
}

function openEditPanel(msgId, currentText) {
    editingMsgId = msgId;
    
    // ВЫЧИСЛЯЕМ КОЛЛЕКЦИЮ ЗАНОВО ПРИ КАЖДОМ ОТКРЫТИИ
    if (chatState.mode === 'general') {
        editingCollection = 'chatcontent';
    } else {
        editingCollection = `privateMessages/${chatState.chatId}/messages`;
    }
    
    editMessageInput.value = currentText;
    editPanel.style.display = 'block';
    editMessageInput.focus();
}

// function openEditPanel(msgId, currentText, collectionName) {
//     editingMsgId = msgId;
//     editingCollection = collectionName;
//     editMessageInput.value = currentText;
//     editPanel.style.display = 'block';
//     editMessageInput.focus();
// }

saveEditBtn.onclick = async () => {
    if (!editingMsgId || !editingCollection) return;
    const newText = editMessageInput.value.trim();
    if (!newText) return;
    
    await db.collection(editingCollection).doc(editingMsgId).update({
        text: newText,
        edited: true,
        editedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    
    closeEditPanel();
};

cancelEditBtn.onclick = closeEditPanel;

deleteMsgBtn.onclick = async () => {
    if (!editingMsgId || !editingCollection) return;
    
    const confirmed = confirm('Удалить сообщение? Отменить нельзя.');
    if (!confirmed) return;
    
    await db.collection(editingCollection).doc(editingMsgId).delete();
    
    const msgElement = document.getElementById(`msg-${editingMsgId}`);
    if (msgElement) msgElement.remove();
    
    closeEditPanel();
};
</script>
