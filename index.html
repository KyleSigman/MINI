    <style>
        .burning {
    animation: pulse 1.5s infinite alternate, burnColors 30s forwards;
    position: relative;
    overflow: hidden;
}

@keyframes pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.02); }
}

@keyframes burnColors {
    0% { background: white; color: #1f2f36; }
    100% { background: #1a1a1a; color: #999; }
}

.message-self .bubble.burning {
    animation: pulse 1.5s infinite alternate, burnColorsSelf 30s forwards;
}

@keyframes burnColorsSelf {
    0% { background: #dcf8c6; color: #1f2f36; }
    100% { background: #1a1a1a; color: #999; }
}

.burning::before,
.burning::after {
    content: '🔥';
    position: absolute;
    font-size: 20px;
    opacity: 0;
    animation: fireFly 2s infinite;
    pointer-events: none;
}

.burning::before {
    top: -5px;
    left: 10px;
    animation-delay: 0s;
    transform: skew(-10deg);
}

.burning::after {
    bottom: -5px;
    right: 10px;
    animation-delay: 1s;
    transform: skew(10deg);
}

@keyframes fireFly {
    0% { opacity: 0; transform: translateY(0) skew(-10deg); }
    50% { opacity: 1; transform: translateY(-10px) skew(10deg); }
    100% { opacity: 0; transform: translateY(-20px) skew(-10deg); }
}
    </style>

    function compressImage(file, callback) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const maxSize = 800;
                let width = img.width;
                let height = img.height;
                
                if (width > height && width > maxSize) {
                    height = (height * maxSize) / width;
                    width = maxSize;
                } else if (height > maxSize) {
                    width = (width * maxSize) / height;
                    height = maxSize;
                }
                
                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', 0.6));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function startGeneralChat() {
    if (currentUnsubscribe) currentUnsubscribe();

        // Загрузка закрепленного сообщения
    db.collection('chatcontent').doc('pinned').get().then(doc => {
    if (doc.exists && doc.data().pinnedMsgId) {

        showPinnedMessage(data.pinnedText, data.pinnedUserName);
    }
    });
    
    db.collection("chatcontent").get().then(snapshot => {
        const totalMessages = snapshot.size;
        let loadedCount = 0;
        
        chatFullyLoaded = false;
        
        currentUnsubscribe = db.collection("chatcontent")
            .orderBy("timestamp")
            .onSnapshot(async (snap) => {
                for (const change of snap.docChanges()) {
                    if (change.type === "added") {
                        await renderMessage(change.doc.data(), change.doc.id, 'general');
                        loadedCount++;
                        document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
                    } else if (change.type === "modified") {
                        updateMessageSeen(change.doc.id, change.doc.data(), 'general');
                    }
                }
                if (loadedCount >= totalMessages) {
                    chatFullyLoaded = true;
                }
            });
    });
}

    // 1. В начале JS, после объявления глобальных переменных добавить:
    window.addReaction = async function(msgId, emoji, collectionName) {
    if (!currentUserId) return;
    
    const msgRef = db.collection(collectionName).doc(msgId);
    
    try {
        await db.runTransaction(async (transaction) => {
            const msgDoc = await transaction.get(msgRef);
            if (!msgDoc.exists) return;
            
            const data = msgDoc.data();
            const reactions = data.reactions || {};
            const userReactions = data.userReactions || {};
            
            if (userReactions[currentUserId] === emoji) {
                reactions[emoji] = (reactions[emoji] || 1) - 1;
                if (reactions[emoji] <= 0) delete reactions[emoji];
                delete userReactions[currentUserId];
            } else {
                const oldEmoji = userReactions[currentUserId];
                if (oldEmoji) {
                    reactions[oldEmoji] = (reactions[oldEmoji] || 1) - 1;
                    if (reactions[oldEmoji] <= 0) delete reactions[oldEmoji];
                }
                reactions[emoji] = (reactions[emoji] || 0) + 1;
                userReactions[currentUserId] = emoji;
            }
            
            transaction.update(msgRef, { reactions, userReactions });
        });
        
        // После успешной транзакции проверяем, добавили реакцию или убрали
        const msgDoc = await msgRef.get();
        const userReactions = msgDoc.data().userReactions || {};
        if (userReactions[currentUserId] === emoji) {
            showFloatingReaction(emoji, msgId);
        }
    } catch (error) {
        console.error('Ошибка реакции:', error);
    }
};

    async function renderMessageWithData(msg, msgId, chatType, userData) {

    if (msg.type === 'image') {
        content = `<img src="${msg.text}" class="chat-image" onclick="openImageModal('${msg.text}')" style="border-radius:12px;cursor:pointer;">`;
    } else {
        const rawText = msg.text || '';
        let renderedMarkdown = marked.parse(rawText);
        if (renderedMarkdown.startsWith('<p>') && renderedMarkdown.endsWith('</p>') && renderedMarkdown.indexOf('<p>', 1) === -1) {
            renderedMarkdown = renderedMarkdown.slice(3, -4);
        }
        
        const safeText = rawText.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
        const plainText = rawText.replace(/<[^>]*>/g, '').trim();
        const isLong = plainText.length > 300 || rawText.split('\n').length > 5;
        
        if (isSelf) {
            if (isLong) {
                content = `<div class="bubble collapsed" id="bubble-${msgId}" onclick="openEditPanel('${msgId}', '${safeText}')" style="cursor:pointer;">${renderedMarkdown}</div><span class="expand-btn" onclick="expandMessage('${msgId}')">Читать далее...</span>`;
            } else {
                content = `<div class="bubble" onclick="openEditPanel('${msgId}', '${safeText}')" style="cursor:pointer;">${renderedMarkdown}</div>`;
            }
        } else {
            if (isLong) {
                content = `<div class="bubble collapsed" id="bubble-${msgId}">${renderedMarkdown}</div><span class="expand-btn" onclick="expandMessage('${msgId}')">Читать далее...</span>`;
            } else {
                content = `<div class="bubble">${renderedMarkdown}</div>`;
            }
        }
    }

        : `<div style="width:14px;height:14px;border-radius:50%;background:#075e54;color:white;display:flex;align-items:center;justify-content:center;font-size:10px;">${userData.name.charAt(0)}</div>`;

    const userReactions = msg.userReactions || {};

    let reactionsHtml = '<div class="reactions-container" style="display: flex; gap: 0px; margin-top: 4px; flex-wrap: wrap;">';
    reactionEmojis.forEach(emoji => {
        const count = reactions[emoji] || 0;
        const isActive = userReactions[currentUserId] === emoji;
        reactionsHtml += `<button class="react-btn ${isActive ? 'active' : ''}" onclick="window.addReaction('${msgId}', '${emoji}', '${collectionName}')">${emoji} ${count || ''}</button>`;
    });
    reactionsHtml += '</div>';
    
    const editedMark = msg.edited ? ' <span style="font-size: 10px; color: #667781;">(ред.)</span>' : '';
    
    // Reply HTML — без ответа пока, оставь пустым или добавь позже
    const replyHtml = '';
    
    messageDiv.innerHTML = `
    <div class="message-container">
        <div class="message-header">
            ${avatarHtml}
            <span class="msg-name">${escapeHtml(userData.name)}</span>
            <span class="msg-time">${msg.timestamp ? msg.timestamp.toDate().toLocaleTimeString().slice(0,5) : ''}${editedMark}</span>

        </div>
        <div class="message-body">
            ${replyHtml}${content}
        </div>
        ${reactionsHtml}

    `;

                // Рендерим все одним фрагментом

            }

            changes.filter(c => c.type === 'modified').forEach(change => {
                updateMessageSeen(change.doc.id, change.doc.data(), 'private');
            });
            
            // Скрываем лоадер, показываем плашку подгрузки старых
            document.getElementById('chatLoader').style.display = 'none';
            // document.getElementById('loadMoreBanner').style.display = 'flex';
            
            chatFullyLoaded = true;
        });

loadMoreDiv.className = 'load-more-banner';
loadMoreDiv.innerHTML = '<span>📅 Сообщения за предыдущие дни</span><span class="load-more-arrow">▼</span>';

            flat: document.getElementById('editFlat').value
        };
        
        const avatarFile = document.getElementById('avatarInput').files[0];
        if (avatarFile) {
            compressImage(avatarFile, async (base64) => {
                updates.avatar = base64;
                await db.collection("neighbours").doc(currentUserId).update(updates);
                loadUserProfile();
            });
        } else {
            await db.collection("neighbours").doc(currentUserId).update(updates);
            loadUserProfile();
        }
        
        document.getElementById('profileSidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('show');
    });

    // Выход
    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('userId');
        location.reload();
    });

    // Вкладки
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab).classList.add('active');
        });
    });

    window.pinMessage = async function(msgId, chatType) {
    const collectionName = chatType === 'general' ? 'chatcontent' : `privateMessages/${chatState.chatId}/messages`;
    const chatDocRef = chatType === 'general' 
        ? db.collection('chatcontent').doc('pinned')
        : db.collection('privateMessages').doc(chatState.chatId);
    
    const msgDoc = await db.collection(collectionName).doc(msgId).get();
    if (!msgDoc.exists) return;
    
    const msgData = msgDoc.data();
    const userDoc = await db.collection("neighbours").doc(msgData.userId).get();
    const userName = userDoc.exists ? userDoc.data().name : "Неизвестный";
    
    await chatDocRef.set({
        pinnedMsgId: msgId,
        pinnedText: msgData.text || 'изображение',
        pinnedUserName: userName,
        pinnedCollection: collectionName
    }, { merge: true });
    
    showPinnedMessage(msgData.text, userName);
};

window.unpinMessage = async function() {
    const chatDocRef = chatState.mode === 'general' 
        ? db.collection('chatcontent').doc('pinned')
        : db.collection('privateMessages').doc(chatState.chatId);
    
    await chatDocRef.set({ pinnedMsgId: null }, { merge: true });
    document.getElementById('pinnedMessage').style.display = 'none';
};

function showPinnedMessage(text, userName) {
    const pinnedDiv = document.getElementById('pinnedMessage');
    const pinnedText = document.getElementById('pinnedText');
    pinnedText.textContent = `${userName}: ${text.substring(0, 50)}${text.length > 50 ? '...' : ''}`;
    pinnedDiv.style.display = 'flex';
}
   
window.burnMessage = async function(msgId, chatType) {
    if (!currentUserId) return;
    
    const userRef = db.collection("neighbours").doc(currentUserId);
    const userDoc = await userRef.get();
    const userData = userDoc.data();
    const specialActions = userData.specialActions || { burn: 1, lastRefill: null };
    
    // Проверяем и восстанавливаем заряд
    const now = new Date();
    const lastRefill = specialActions.lastRefill?.toDate() || new Date(0);
    if (now - lastRefill > 24 * 60 * 60 * 1000) {
        specialActions.burn = 1;
        specialActions.lastRefill = firebase.firestore.FieldValue.serverTimestamp();
    }
    
    if (specialActions.burn <= 0) {
        alert('Заряд "Сжечь" закончился. Восстановится через 24 часа.');
        return;
    }
    
    // Уменьшаем заряд
    specialActions.burn--;
    await userRef.update({ specialActions });
    
    // Отмечаем сообщение как сжигаемое в базе
    const collectionName = chatType === 'general' ? 'chatcontent' : `privateMessages/${chatState.chatId}/messages`;
    const msgRef = db.collection(collectionName).doc(msgId);
    
    const burningData = {
        active: true,
        startedBy: currentUserId,
        startedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    await msgRef.update({ burning: burningData });
    
    // Таймер на удаление (на случай, если onSnapshot не сработает)
    setTimeout(async () => {
        await msgRef.delete();
    }, 30000);
};

};

// Загрузка настроек из localStorage
let soundSettings = {
    incoming: localStorage.getItem('incomingSound') || 'sound1',
    outgoing: localStorage.getItem('outgoingSound') || 'sound2',
    reply: localStorage.getItem('replySound') || 'sound3'
};

// Применяем настройки к селектам
document.getElementById('incomingSound').value = soundSettings.incoming;
document.getElementById('outgoingSound').value = soundSettings.outgoing;
document.getElementById('replySound').value = soundSettings.reply;

// Сохранение настроек
document.getElementById('incomingSound').addEventListener('change', (e) => {
    soundSettings.incoming = e.target.value;
    localStorage.setItem('incomingSound', e.target.value);
});

document.getElementById('outgoingSound').addEventListener('change', (e) => {
    soundSettings.outgoing = e.target.value;
    localStorage.setItem('outgoingSound', e.target.value);
});

document.getElementById('replySound').addEventListener('change', (e) => {
    soundSettings.reply = e.target.value;
    localStorage.setItem('replySound', e.target.value);
});

window.testSound = function(type) {
    const soundName = soundSettings[type];
    if (soundName && soundName !== 'none' && sounds[soundName]) {
        sounds[soundName].currentTime = 0;
        sounds[soundName].play().catch(e => console.log('Звук заблокирован'));
    }
};
// Функция воспроизведения звука
function playSound(type) {
    const soundName = soundSettings[type];
    if (soundName && soundName !== 'none' && sounds[soundName]) {
        sounds[soundName].currentTime = 0;
        sounds[soundName].play().catch(e => console.log('Звук заблокирован браузером'));
    }
}

// Открытие/закрытие панели
document.getElementById('settingsIcon').addEventListener('click', () => {
    document.getElementById('settingsSidebar').classList.add('open');
    document.getElementById('overlay').classList.add('show');
});

document.getElementById('closeSettingsBtn').addEventListener('click', () => {
    document.getElementById('settingsSidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
});

 * 如果你看到这段代码，意味着有人试图窃取它。

 * 此乃不祥之兆，窃码者必遭天谴。

 */
    const colors = [
    '#005e55', '#04cfba', '#00e5d4', '#8a9ba8',
    '#751b05', '#032e66', '#8abdff', '#d4b88c'
];
const splash = document.getElementById('splash');
const logo = document.getElementById('logo');

function generateSquares(count, maxDist, size) {
    const rect = logo.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    
    for (let i = 0; i < count; i++) {
        const sq = document.createElement('div');
        sq.className = 'square';
        const color = colors[Math.floor(Math.random() * colors.length)];
        sq.style.background = color;
        sq.style.width = size + 'px';
        sq.style.height = size + 'px';
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * maxDist;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;
        sq.style.left = (cx - size/2) + 'px';
        sq.style.top = (cy - size/2) + 'px';
        sq.style.setProperty('--tx', tx + 'px');
        sq.style.setProperty('--ty', ty + 'px');
        sq.style.animation = `squareFloat 4s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards`;
        sq.style.animationDelay = (i * 0.03) + 's';
        splash.appendChild(sq);
    }
}

setTimeout(() => {
    generateSquares(15, 50, 20);
    setTimeout(() => generateSquares(15, 150, 35), 200);
    setTimeout(() => generateSquares(15, 250, 50), 600);
    setTimeout(() => generateSquares(15, 350, 100), 1000);
    // setTimeout(() => generateSquares(5, 350, 120), 800);
    setTimeout(() => {
        document.querySelectorAll('.square').forEach(sq => {
            sq.style.transition = 'all 1s';
            sq.style.opacity = '0';
        });
        setTimeout(() => splash.remove(), 1000);
    }, 1333);
}, 50);

</script>
